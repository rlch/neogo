<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="neo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#neo-gradient)"/>
  <!-- Neo4j-style graph nodes -->
  <circle cx="40" cy="50" r="12" fill="#fff" opacity="0.95"/>
  <circle cx="88" cy="50" r="12" fill="#fff" opacity="0.95"/>
  <circle cx="64" cy="90" r="12" fill="#fff" opacity="0.95"/>
  <!-- Relationship lines -->
  <line x1="52" y1="50" x2="76" y2="50" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <line x1="46" y1="60" x2="58" y2="80" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <line x1="82" y1="60" x2="70" y2="80" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <!-- Go gopher ear hint -->
  <ellipse cx="40" cy="35" rx="6" ry="8" fill="#fff" opacity="0.6"/>
  <ellipse cx="88" cy="35" rx="6" ry="8" fill="#fff" opacity="0.6"/>
</svg>
